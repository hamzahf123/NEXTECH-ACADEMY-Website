<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Decorative gold arches artwork">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08192c"/>
      <stop offset="0.55" stop-color="#050e1b"/>
      <stop offset="1" stop-color="#03080f"/>
    </linearGradient>
    <radialGradient id="a-glow" cx="0" cy="0" r="1" gradientTransform="translate(880 160) scale(520)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e5c27a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e5c27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a-gold" x1="540" y1="80" x2="1120" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f9ecc9"/>
      <stop offset="0.45" stop-color="#d9b45b"/>
      <stop offset="1" stop-color="#8f6a24"/>
    </linearGradient>
    <radialGradient id="a-orb" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#fff3d2" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#e0bd74" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a57a2c" stop-opacity="0.05"/>
    </radialGradient>
    <linearGradient id="a-beam" x1="600" y1="0" x2="1100" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="a-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#dcbf85" stroke-opacity="0.05"/>
    </pattern>
    <filter id="a-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <clipPath id="a-clip"><rect width="1200" height="760" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#a-clip)">
    <rect width="1200" height="760" fill="url(#a-bg)"/>
    <rect width="1200" height="760" fill="url(#a-grid)"/>
    <rect width="1200" height="760" fill="url(#a-glow)"/>
    <path d="M560 760L1010 0h190L760 760z" fill="url(#a-beam)"/>

    <!-- arches -->
    <g fill="none" stroke="url(#a-gold)">
      <path d="M620 700V330c0-118 96-214 214-214s214 96 214 214v370" stroke-opacity="0.75" stroke-width="2"/>
      <path d="M664 700V338c0-94 76-170 170-170s170 76 170 170v362" stroke-opacity="0.55" stroke-width="1.4"/>
      <path d="M708 700V346c0-70 57-127 126-127s126 57 126 127v354" stroke-opacity="0.4" stroke-width="1.2"/>
      <path d="M752 700V354c0-46 37-83 82-83s82 37 82 83v346" stroke-opacity="0.3" stroke-width="1"/>
    </g>
    <path d="M834 128c-112 0-203 91-203 203v369h406V331c0-112-91-203-203-203z" fill="#e5c27a" fill-opacity="0.035"/>
    <path d="M834 271c-33 0-60 27-60 60v369h120V331c0-33-27-60-60-60z" fill="#e5c27a" fill-opacity="0.05"/>

    <!-- orb -->
    <circle cx="900" cy="270" r="118" fill="url(#a-orb)"/>
    <circle cx="900" cy="270" r="118" fill="none" stroke="#f7e5bb" stroke-opacity="0.35"/>
    <circle cx="900" cy="270" r="150" fill="none" stroke="#dcbf85" stroke-opacity="0.2"/>
    <circle cx="864" cy="232" r="26" fill="#fff8e6" fill-opacity="0.55"/>

    <!-- constellation -->
    <g fill="#f3dfae">
      <circle cx="1046" cy="420" r="2.6" opacity="0.9"/>
      <circle cx="1120" cy="330" r="2" opacity="0.7"/>
      <circle cx="980" cy="560" r="2.2" opacity="0.6"/>
      <circle cx="600" cy="240" r="2" opacity="0.5"/>
      <circle cx="552" cy="520" r="2.6" opacity="0.4"/>
    </g>
    <g stroke="#dcbf85" stroke-opacity="0.25">
      <path d="M1046 420L1120 330M1046 420L980 560"/>
    </g>

    <!-- floor line + diamonds -->
    <path d="M0 700h1200" stroke="#dcbf85" stroke-opacity="0.18"/>
    <path d="M120 700l14-14 14 14-14 14z" fill="none" stroke="#d9b45b" stroke-opacity="0.6"/>
    <path d="M96 700h-36" stroke="#d9b45b" stroke-opacity="0.4"/>
    <path d="M186 700h36" stroke="#d9b45b" stroke-opacity="0.4"/>

    <!-- editorial lines -->
    <g stroke="#f4e5c3" stroke-opacity="0.16">
      <path d="M80 120h250M80 140h180"/>
    </g>
    <circle cx="80" cy="180" r="4" fill="#d9b45b" fill-opacity="0.7"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="759" rx="28" fill="none" stroke="#dcbf85" stroke-opacity="0.18"/>
</svg>
