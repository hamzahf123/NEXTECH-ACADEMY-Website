<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Graphic designing course illustration with design tools and shapes">
  <defs>
    <linearGradient id="g-bg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d2746"/>
      <stop offset="1" stop-color="#050f1f"/>
    </linearGradient>
    <radialGradient id="g-glow" cx="0" cy="0" r="1" gradientTransform="translate(120 20) scale(280)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2ec4b6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2ec4b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="1" stop-color="#dda81a"/>
    </linearGradient>
    <pattern id="g-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="g-clip"><rect width="640" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#g-clip)">
    <rect width="640" height="400" fill="url(#g-bg)"/>
    <rect width="640" height="400" fill="url(#g-grid)"/>
    <rect width="640" height="400" fill="url(#g-glow)"/>

    <!-- artboard -->
    <rect x="58" y="58" width="524" height="284" rx="18" fill="#0a1b33" stroke="#ffffff" stroke-opacity="0.12"/>
    <!-- rulers / guides -->
    <path d="M58 92h524M92 58v284" stroke="#f6c445" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="4 6"/>
    <path d="M58 306h524M482 58v284" stroke="#2ec4b6" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 6"/>

    <!-- shapes -->
    <circle cx="214" cy="182" r="70" fill="url(#g-gold)"/>
    <rect x="268" y="142" width="128" height="128" rx="22" fill="#2ec4b6" fill-opacity="0.85"/>
    <path d="M378 300l58-118 58 118z" fill="#eef4fb" fill-opacity="0.9"/>
    <circle cx="214" cy="182" r="70" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

    <!-- bezier path + handles -->
    <path d="M132 300C210 214 300 254 396 108" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="2.4" stroke-dasharray="7 6"/>
    <g>
      <rect x="126" y="294" width="12" height="12" transform="rotate(45 132 300)" fill="#ffffff"/>
      <rect x="390" y="102" width="12" height="12" transform="rotate(45 396 108)" fill="#ffffff"/>
      <circle cx="132" cy="300" r="4" fill="#f6c445"/>
      <circle cx="396" cy="108" r="4" fill="#f6c445"/>
      <path d="M132 300l44-26M396 108l-40 30" stroke="#f6c445" stroke-width="1.6" stroke-opacity="0.8"/>
      <circle cx="176" cy="274" r="4" fill="#f6c445"/>
      <circle cx="356" cy="138" r="4" fill="#f6c445"/>
    </g>

    <!-- pen tool -->
    <g transform="translate(508 300) rotate(12)">
      <path d="M0 0l16-34 10 10L-8 8z" fill="#eef4fb"/>
      <path d="M-8 8l-4 14 12-10z" fill="#f6c445"/>
      <circle cx="12" cy="-16" r="5" fill="#0a1b33" stroke="#eef4fb" stroke-width="3"/>
    </g>

    <!-- type specimen -->
    <text x="92" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#ffffff" fill-opacity="0.9">Aa</text>
    <text x="146" y="108" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#8fa3bf">SORA / INTER</text>

    <!-- swatches -->
    <g>
      <circle cx="540" cy="88" r="10" fill="#f6c445"/>
      <circle cx="566" cy="88" r="10" fill="#2ec4b6"/>
      <circle cx="592" cy="88" r="10" fill="#eef4fb"/>
      <circle cx="540" cy="114" r="10" fill="#ff7a7a"/>
      <circle cx="566" cy="114" r="10" fill="#12305a" stroke="#ffffff" stroke-opacity="0.3"/>
    </g>

    <!-- layer panel -->
    <g>
      <rect x="506" y="176" width="96" height="98" rx="10" fill="#0b1b33" stroke="#ffffff" stroke-opacity="0.14"/>
      <rect x="518" y="190" width="12" height="12" rx="3" fill="#f6c445"/>
      <rect x="538" y="192" width="48" height="8" rx="4" fill="#ffffff" fill-opacity="0.2"/>
      <rect x="518" y="212" width="12" height="12" rx="3" fill="#2ec4b6"/>
      <rect x="538" y="214" width="36" height="8" rx="4" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="518" y="234" width="12" height="12" rx="3" fill="#eef4fb" fill-opacity="0.7"/>
      <rect x="538" y="236" width="42" height="8" rx="4" fill="#ffffff" fill-opacity="0.16"/>
      <rect x="518" y="256" width="12" height="12" rx="3" fill="#ff7a7a"/>
      <rect x="538" y="258" width="30" height="8" rx="4" fill="#ffffff" fill-opacity="0.16"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="639" height="399" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
</svg>
